name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://user:password@localhost:5432/test?sslmode=require"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Lint
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ──────────────────────────────────────────────────────────────
  # 2. Type Check
  # ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # ──────────────────────────────────────────────────────────────
  # 3. Build
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-production"
          DATABASE_URL: "postgresql://user:password@localhost:5432/test?sslmode=require"

  # ──────────────────────────────────────────────────────────────
  # 4. Unit Tests (Vitest)
  # ──────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit -- --run --reporter=verbose
        env:
          NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-production"
          DATABASE_URL: "postgresql://user:password@localhost:5432/test?sslmode=require"

  # ──────────────────────────────────────────────────────────────
  # 5. E2E Tests (Playwright) — optional, runs against dev server
  # ──────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-production"
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
